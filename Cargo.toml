[package]
name = "evemu_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
chrono = "0.4"
regex = "1"
#pcap = { version = "0.9.2", default-features = false } #监听
#sysinfo = { version = "0.30.13", default-features = false } #系统

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-lmcfgthread"]
